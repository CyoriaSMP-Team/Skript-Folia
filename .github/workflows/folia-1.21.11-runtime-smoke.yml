name: Folia 1.21.11 Runtime Smoke Test

on:
  push:
    branches:
      - "sync/skript-**"
  pull_request:
    branches:
      - "folia/1.21.11"

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout with aliases submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Skript candidate
        run: ./gradlew --no-daemon build

      - name: Download Folia 1.21.11 and install exact candidate
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.papermc.io/v2/projects/folia/versions/1.21.11"
          BUILD="$(curl -fsSL "$API/builds" | jq -r '.builds[-1].build')"
          test -n "$BUILD" && test "$BUILD" != "null"
          mkdir -p runtime/plugins/Skript/scripts
          curl -fsSL "$API/builds/$BUILD/downloads/folia-1.21.11-$BUILD.jar" -o runtime/folia.jar
          JAR="$(find build/libs -maxdepth 1 -type f -name 'Skript*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" runtime/plugins/Skript.jar
          printf 'eula=true\n' > runtime/eula.txt
          cat > runtime/server.properties <<'PROPERTIES'
          motd=CyoriaSMP Folia 1.21.11 runtime smoke
          server-ip=127.0.0.1
          server-port=25565
          online-mode=false
          max-players=1
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          level-name=world
          PROPERTIES
          cat > runtime/plugins/Skript/scripts/cyoria-runtime-smoke.sk <<'SKRIPT'
          on load:
              send "CyoriaSMP Folia 1.21.11 runtime smoke" to console
          SKRIPT
          {
            echo "commit=$GITHUB_SHA"
            echo "folia_version=1.21.11"
            echo "folia_build=$BUILD"
            echo "plugin_jar=$JAR"
            sha256sum runtime/plugins/Skript.jar
          } | tee runtime/evidence.txt

      - name: Start Folia and verify Skript loads
        shell: bash
        run: |
          set -euo pipefail
          cd runtime
          java -Xms1G -Xmx2G -jar folia.jar --nogui > folia.log 2>&1 &
          PID=$!
          trap 'kill -TERM "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            if grep -q "Done (" folia.log; then
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat folia.log
              exit 1
            fi
            sleep 2
          done
          grep -q "Done (" folia.log
          grep -Fq "[Skript] Enabling Skript" folia.log
          grep -Fq "CyoriaSMP Folia 1.21.11 runtime smoke" folia.log
          if grep -E "Could not load 'plugins/Skript.jar'|Error occurred while enabling Skript|\[Skript\].*Severe Error" folia.log; then
            exit 1
          fi

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skript-folia-1.21.11-runtime-evidence-${{ github.sha }}
          path: |
            runtime/folia.log
            runtime/evidence.txt
          if-no-files-found: warn
          retention-days: 30
