name: Paper 1.21.11 Compatibility Build and Test

on:
  push:
    branches:
      - "sync/skript-**"
  pull_request:
    branches:
      - "folia/1.21.11"

permissions:
  contents: read

concurrency:
  group: skript-folia-1.21.11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with aliases submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Build and test
        run: ./gradlew --no-daemon checkAliases build JUnitJava21 JUnitJava25 testNaming
